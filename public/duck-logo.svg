<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Duck Body & Head -->
  <path d="M 30 75 C 20 75 15 60 25 48 C 30 42 40 40 45 44 C 42 32 48 20 62 20 C 76 20 82 30 78 44 C 76 52 70 56 65 58 C 72 62 76 70 72 76 C 68 82 40 82 30 75 Z" fill="url(#duckGrad)" />
  
  <!-- Duck Eye -->
  <circle cx="64" cy="32" r="5" fill="#064E3B"/>
  <circle cx="66" cy="30" r="1.8" fill="#FFFFFF"/>

  <!-- Academic Glasses -->
  <circle cx="64" cy="33" r="8" fill="none" stroke="#064E3B" stroke-width="2.5"/>
  <line x1="56" y1="33" x2="48" y2="33" stroke="#064E3B" stroke-width="2.5"/>

  <!-- Duck Beak -->
  <path d="M 72 36 Q 88 37 82 46 Q 72 48 68 43 Z" fill="url(#beakGrad)" />

  <!-- Mortarboard / Graduation Cap -->
  <path d="M 38 22 L 62 14 L 84 22 L 60 30 Z" fill="#064E3B"/>
  <rect x="56" y="24" width="12" height="6" fill="#064E3B"/>
  <path d="M 78 22 L 80 34" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="80" cy="35" r="2" fill="#F59E0B"/>
</svg>
